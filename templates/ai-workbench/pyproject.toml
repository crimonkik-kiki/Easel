[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench-template"
version = "0.3.0"
description = "Portable AI workbench extracted from Easel"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.45,<2"]

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
